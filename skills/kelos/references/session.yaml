# Session with an ephemeral workspace
apiVersion: kelos.dev/v1alpha2
kind: Session
metadata:
  name: interactive-review
spec:
  worker:
    type: claude-code
    credentials:
      type: api-key
      secretRef:
        name: claude-credentials
---
# Session with a persistent workspace, repository, and agent configuration
apiVersion: kelos.dev/v1alpha2
kind: Session
metadata:
  name: persistent-review
spec:
  worker:
    type: codex
    credentials:
      type: oauth
      secretRef:
        name: codex-credentials
    workspaceRef:
      name: my-workspace
    agentConfigRefs:
      - name: code-reviewer
  volumeClaimTemplate:
    accessModes:
      - ReadWriteOnce
    resources:
      requests:
        storage: 10Gi
---
# OpenCode Session without built-in credential injection
apiVersion: kelos.dev/v1alpha2
kind: Session
metadata:
  name: opencode-chat
spec:
  worker:
    type: opencode
    credentials:
      type: none
---
# SessionSpawner distributing generated Sessions across multiple agent accounts
apiVersion: kelos.dev/v1alpha2
kind: SessionSpawner
metadata:
  name: multi-account-sessions
spec:
  when:
    githubWebhook:
      repository: my-org/my-repo
      events:
        - issues
      filters:
        - event: issues
          action: opened
  credentials:
    - name: account-a
      type: oauth
      secretRef:
        name: claude-account-a
    - name: account-b
      type: oauth
      secretRef:
        name: claude-account-b
  sessionTemplate:
    worker:
      type: claude-code
      workspaceRef:
        name: my-workspace
    initialBranch: "issue-{{.Number}}"
    initialPrompt: "Handle issue #{{.Number}}: {{.Title}}"
