# WebhookGateway authenticates GitHub webhook deliveries for kelos-dev/agora
# and supplies GitHub API credentials for enrichment and reporting.
apiVersion: kelos.dev/v1alpha2
kind: WebhookGateway
metadata:
  name: agora
spec:
  github:
    secretRef:
      name: github-webhook-secret
    credentialsRef:
      name: github-webhook-secret
