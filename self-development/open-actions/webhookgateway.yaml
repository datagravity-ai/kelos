# WebhookGateway authenticates GitHub webhook deliveries for
# kelos-dev/open-actions and supplies GitHub API credentials for enrichment and
# reporting.
apiVersion: kelos.dev/v1alpha2
kind: WebhookGateway
metadata:
  name: open-actions
spec:
  github:
    secretRef:
      name: github-webhook-secret
    credentialsRef:
      name: github-webhook-secret
